{% extends "base.html" %}{% block content %}<main class="page"><p class="eyebrow">YOUR ACTIVITY</p><h1>ປະຫວັດການຝຶກ</h1><div class="panel">{% for w in workouts %}<div class="history-row"><div class="history-symbol">⚡</div><div class="history-info"><b>{{ w.jumps }} ຄັ້ງ</b><small>{{ w.created_at.strftime('%d/%m/%Y • %H:%M') }}</small></div><span>{{ w.duration//60 }}:{{ '%02d' % (w.duration%60) }} ນາທີ</span></div>{% else %}<p class="empty">ຍັງບໍ່ມີປະຫວັດການຝຶກ</p>{% endfor %}</div></main>{% endblock %}
