services:
  - type: web
    name: rope-skipping-counter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rope-counter-db
          property: connectionString
databases:
  - name: rope-counter-db
    plan: basic-256mb
